# brodbandproductions.com: plain static site, no build step.
[build]
  publish = "public"

# Old .html addresses redirect to the clean ones (/animated instead of /animated.html)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images are re-checked on each visit (a quick "not modified" reply when unchanged),
# so a replaced image shows up right away instead of after a week in the browser cache.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
